# Contract test fixture only: a neutral reference biped, not a connected robot.
# It is intentionally not a real Robot Profile or a deployable asset.
apiVersion: robolab.dev/v1alpha1
kind: RobotProfile

metadata:
  id: test.reference_biped
  version: 1.0.0
  vendor: Test Fixture
  model: Reference Biped
  variant: neutral

description:
  mjcf: model/reference.xml
  rootBody: pelvis
  feet: [left_ankle_roll_link, right_ankle_roll_link]
  imuFrame: imu_in_pelvis
  jointSet: test.reference_biped.joints.v1

control:
  mode: joint_position
  frequencyHz: 50
  actionScaleProfile: default
  stateEstimator: onboard

targets:
  simulation:
    type: mujoco
    enabled: true
  physical:
    enabled: false
    driver: null

safety:
  fallbackState: damping
  commandTimeoutMs: 100
  stateTimeoutMs: 100
  limitsRef: safety/limits.yaml
  gainsRef: safety/gains.yaml

capabilities:
  simulation: true
  training: true
  motorCommunication: false
  sensorStreaming: false
  calibration: false
  physicalDeployment: false

bindings:
  simulation: bindings/simulation.yaml
  tasks: bindings/tasks.yaml
