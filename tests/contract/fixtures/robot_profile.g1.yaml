# B1 contract test fixture：G1 29DoF simulation-only Profile。
# 与 docs/ROBOT_ADAPTATION.md §2 最小内容一致；正式的 robots/unitree.g1.29dof/
# Profile 在 B2.1 建立后以本 fixture 为基线。
apiVersion: robolab.dev/v1alpha1
kind: RobotProfile

metadata:
  id: unitree.g1.29dof
  version: 1.0.0
  vendor: Unitree
  model: G1
  variant: 29dof

description:
  mjcf: model/g1.xml
  rootBody: pelvis
  feet: [left_ankle_roll_link, right_ankle_roll_link]
  imuFrame: imu_in_pelvis
  jointSet: g1.29dof.canonical.v1

control:
  mode: joint_position
  frequencyHz: 50
  actionScaleProfile: default
  stateEstimator: onboard

targets:
  simulation:
    type: mujoco
    enabled: true
  physical:
    enabled: false
    driver: null

safety:
  fallbackState: damping
  commandTimeoutMs: 100
  stateTimeoutMs: 100
  limitsRef: safety/limits.yaml
  gainsRef: safety/gains.yaml

capabilities:
  simulation: true
  training: true
  motorCommunication: false
  sensorStreaming: false
  calibration: false
  physicalDeployment: false

bindings:
  simulation: bindings/simulation.yaml
  tasks: bindings/tasks.yaml
