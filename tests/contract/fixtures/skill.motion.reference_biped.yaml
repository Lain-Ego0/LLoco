apiVersion: robolab.dev/v1alpha1
kind: MotionSkill

metadata:
  id: motion.test-reference-biped-velocity
  name: Test Reference Biped Velocity Fixture
  version: 0.1.0
  description: Synthetic compatibility fixture; not a real robot or policy.
  license: Apache-2.0
  source:
    repository: https://github.com/Lain-Ego0/RoboLab-Skill
    revision: refs/tags/test-reference-biped-v0.1.0
  provenance:
    repository: https://example.invalid/test-reference-biped
    revision: 0123456789abcdef0123456789abcdef01234567
    paths:
      - fixture/policy.onnx
      - fixture/deploy.yaml

spec:
  compatibility:
    platform: ">=0.1.0 <0.2.0"
    skillApi: v1alpha1
    robots:
      - profile: test.reference_biped
        version: ">=1.0.0 <2.0.0"
    controlMode: joint_position
    controlHz: 50
    jointSet: test.reference_biped.joints.v1
    observationSchema: test.reference_biped.velocity.observation.v1
    actionSchema: test.reference_biped.joint-position.v1

  runtime:
    type: onnx
    runner: rl_policy
    protocol: robolab-motion-v1

  artifacts:
    - name: policy
      path: artifacts/policy.onnx
      mediaType: application/onnx
      size: 878421
      sha256: 2a66ca6336eadb3c0b34b557763f3e06d01ff8fcf6260dd4cedbd69d6093fc28
    - name: deploy-params
      path: params/deploy.yaml
      mediaType: application/yaml
      size: 2289
      sha256: 01e1cf3f6ec44e9942494fbb4a9904df07201e14e5551a277f38d7c7d1bda28d

  actions:
    play:
      title: Play in MJLab
      inputSchema: schemas/command.json
      task: test.reference_biped.velocity.flat
    simulate:
      title: Run sim-to-sim
      inputSchema: schemas/command.json
    deploy:
      title: Prepare real-robot deployment
      inputSchema: schemas/command.json

  permissions:
    filesystem:
      read: [skill, robot_profile]
      write: [run]
    network: false
    subprocess: false
    robotState: true
    robotCommand: true

  safety:
    maturity: experimental
    defaultTarget: simulation
    requiredGates: [offline, mjlab_play, sim_to_sim]
    fallbackState: damping
    realRobotRequiresExplicitConfirmation: true

  validation:
    smoke: tests/smoke.yaml
