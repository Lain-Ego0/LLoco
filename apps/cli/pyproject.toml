[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-cli"
version = "0.1.0"
description = "RoboLab command line interface (robolab check / serve / skill ...)"
requires-python = ">=3.10"
dependencies = [
  "robolab-core",
  "robolab-api",
]

[project.scripts]
robolab = "robolab_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
