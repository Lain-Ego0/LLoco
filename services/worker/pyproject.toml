[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["robolab-core"]

[project.scripts]
robolab-worker = "robolab_worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
