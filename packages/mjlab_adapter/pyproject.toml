[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-mjlab-adapter"
version = "0.1.0"
description = "Controlled discovery and subprocess adapter for the vendored MJLab"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
