[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-mjlab-adapter"
version = "0.1.0"
description = "Controlled discovery and subprocess adapter for the vendored MJLab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Runtime is opt-in so CPU contract CI does not download CUDA/PyTorch.  These
# pins reproduce the validated vendor-compatible stack in the shared robolab
# Conda environment; Warp 1.16 removes an API used by MJLab 1.2.0.
mjlab-runtime = [
  "mjlab==1.2.0",
  "mujoco-warp==3.5.0",
  "mujoco==3.5.0",
  "warp-lang==1.12.0",
  "scipy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
