[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "lainloco"
version = "0.1.0"
description = "Composable locomotion learning experiments built on mjlab."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["mjlab==1.6.0", "numpy", "onnx>=1.19.0"]

[project.optional-dependencies]
cpu = ["mjlab[cpu]", "onnxruntime>=1.19.0; python_version >= '3.11'"]
cu128 = ["mjlab[cu128]", "onnxruntime>=1.19.0; python_version >= '3.11'"]

[project.scripts]
lainloco = "lainloco.cli:main"

[project.entry-points."mjlab.tasks"]
lainloco = "lainloco.bootstrap"

[tool.uv.workspace]
members = ["vendor/mjlab"]

[tool.uv.sources]
mjlab = { workspace = true }

[dependency-groups]
dev = [
  "onnxruntime>=1.19.0; python_version >= '3.11'",
  "pyright>=1.1.408",
  "pytest>=9.0.3",
  "ruff>=0.16.1",
  "ty>=0.0.14",
]

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ty.environment]
extra-paths = ["vendor/mjlab/typings"]

[tool.ty.src]
include = ["src", "tests/contracts", "tests/integration"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
stubPath = "vendor/mjlab/typings"
include = ["src", "tests/contracts", "tests/integration"]
