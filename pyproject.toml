[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "lloco"
version = "0.1.0"
description = "Unitree locomotion tasks and deployment tools for mjlab 1.6"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "The LLoco Developers" }]
keywords = ["unitree", "mujoco", "mjlab", "reinforcement-learning", "robotics"]
dependencies = ["mjlab==1.6.0"]

[project.urls]
Repository = "https://github.com/Lain-Ego0/LLoco"

[project.scripts]
train = "lloco.cli:train"
play = "lloco.cli:play"
list-envs = "lloco.cli:list_envs"
lloco-train = "lloco.cli:train"
lloco-play = "lloco.cli:play"
lloco-list-envs = "lloco.cli:list_envs"
csv-to-npz = "lloco.cli:csv_to_npz"

[dependency-groups]
dev = [
  "pre-commit>=4.3.0",
  "pyright>=1.1.408",
  "pytest>=9.0.3",
  "ruff>=0.16.1",
]

[project.optional-dependencies]
cu128 = ["torch>=2.7.0"]
cpu = ["torch>=2.7.0"]

[tool.uv]
conflicts = [[{ extra = "cu128" }, { extra = "cpu" }]]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
src = ["src"]
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
