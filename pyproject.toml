[tool.uv.workspace]
members = ["mjlab", "packages/lainloco"]

[dependency-groups]
dev = [
  "onnxruntime>=1.19.0; python_version >= '3.11'",
  "pyright>=1.1.408",
  "pytest>=9.0.3",
  "ruff>=0.16.1",
  "ty>=0.0.14",
]

[tool.ruff]
src = ["packages/lainloco/src"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ty.environment]
extra-paths = ["mjlab/typings"]

[tool.ty.src]
include = ["packages/lainloco/src", "tests/contracts", "tests/integration"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
stubPath = "mjlab/typings"
include = ["packages/lainloco/src", "tests/contracts", "tests/integration"]
